{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login - MUSEON</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/jpeg" href="{% static 'favicon.jpeg' %}?v=2">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      /* Soft pastel abstract gradient to match the vibe */
      background: 
        radial-gradient(circle at 15% 50%, rgba(255, 200, 200, 1), transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(255, 235, 170, 1), transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(170, 235, 255, 1), transparent 50%);
      background-color: #ffe6e6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 30px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
      text-align: center;
      color: #1a1a2e;
      animation: fadeIn 0.8s ease-out;
    }
    
    .glass-card .logo {
      height: 65px;
      margin-bottom: 1rem;
      border-radius: 12px;
    }
    
    .glass-card h2 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 0.3rem;
      color: #111;
    }
    
    .glass-card .subtitle {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    
    .glass-card form p {
      text-align: left;
      margin-bottom: 1.2rem;
      position: relative;
    }
    
    .glass-card label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #555;
      margin-bottom: 0.4rem;
    }
    
    .glass-card input {
      width: 100%;
      background: #f8f9fa;
      border: 1px solid rgba(0,0,0,0.05);
      padding: 0.9rem 1rem 0.9rem 2.8rem;
      border-radius: 12px;
      font-size: 0.95rem;
      color: #333;
      outline: none;
      transition: all 0.3s;
    }
    
    .glass-card input:focus {
      background: #fff;
      border-color: #ff5e8c;
      box-shadow: 0 0 0 3px rgba(255, 94, 140, 0.15);
    }
    
    /* Icons for inputs */
    form p:nth-of-type(1) input {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="%23888" viewBox="0 0 16 16"><path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>');
      background-repeat: no-repeat;
      background-position: 1rem center;
    }
    
    form p:nth-of-type(2) input {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="%23888" viewBox="0 0 16 16"><path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/></svg>');
      background-repeat: no-repeat;
      background-position: 1rem center;
    }
    
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.8rem;
      color: #ff5e8c;
      text-decoration: none;
      margin-top: -0.5rem;
      margin-bottom: 1.5rem;
    }
    .forgot-link:hover { text-decoration: underline; }
    
    .btn-submit {
      background: linear-gradient(to right, #ff5e8c, #ffaa6b);
      border: none;
      border-radius: 50px;
      color: #fff;
      font-weight: 600;
      padding: 0.9rem;
      width: 100%;
      font-size: 1.05rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 94, 140, 0.3);
      color: #fff;
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: #999;
      font-size: 0.85rem;
    }
    
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }
    .divider::before { margin-right: 15px; }
    .divider::after { margin-left: 15px; }
    
    .btn-google {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 50px;
      padding: 0.8rem;
      width: 100%;
      font-weight: 600;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.3s;
      text-decoration: none;
    }
    .btn-google:hover {
      background: #fff;
      color: #333;
    }
    
    .footer-text {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #555;
    }
    .footer-text a {
      color: #ff5e8c;
      font-weight: 600;
      text-decoration: none;
    }
    .footer-text a:hover { text-decoration: underline; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @media (max-width: 768px) {
      body { padding: 1rem; }
      .glass-card { padding: 2rem 1.5rem; }
      .glass-card h2 { font-size: 1.5rem; }
      .glass-card .logo { height: 50px; }
    }
  </style>
</head>
<body>

<div class="glass-card">
  <img src="{% static 'favicon.jpeg' %}?v=2" alt="MUSEON" class="logo">
  <h2>Welcome Back</h2>
  <div class="subtitle">Turn your ideas into music.</div>
  
  <form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="alert alert-danger" style="background: rgba(255,0,0,0.1); border:none; color: #d9534f; border-radius: 12px; padding: 10px; font-size: 0.85rem;">
        {% for error in form.non_field_errors %}{{ error }}{% endfor %}
      </div>
    {% endif %}
    
    {{ form.as_p }}
    
    <a href="#" class="forgot-link">Forgot password?</a>
    
    <button type="submit" class="btn-submit">
      Login 
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/></svg>
    </button>
  </form>
  
  <div class="divider">or</div>
  
  <a href="#" class="btn-google">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
    Continue with Google
  </a>
  
  <div class="footer-text">
    No account? <a href="{% url 'signup' %}">Sign up</a>
  </div>
</div>

</body>
</html>
